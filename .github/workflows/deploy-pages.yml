

name: Validar SLENDER

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validacion del proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v7

      - name: Validar HTML, JavaScript y rutas
        run: node scripts/validate-project.mjs
